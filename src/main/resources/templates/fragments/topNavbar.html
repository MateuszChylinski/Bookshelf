<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<header th:fragment="top-navbar">
    <nav class="navbar navbar-light bg-light ">
        <a class="navbar-brand ms-3 mt-1" href="#">Bookshelf</a>
        <div class="d-flex align-items-center">
            <p class=" mb-0 text-center me-3 mt-1">Specific query</p>

            <form class="d-flex" th:object="${userTopNavbarQuery}"
                  th:action="@{/books/search}" method="get">

                <input th:field="*{userQuery}" class="form-control d-flex me-2 mt-1" type="text"
                       placeholder="Search"
                       aria-label="Search" required>
                <button class="btn btn-outline-success mt-1" type="submit">Search</button>
            </form>
        </div>
    </nav>
</header>
</body>
</html>
