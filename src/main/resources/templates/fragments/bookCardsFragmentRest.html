<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search results</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Fragment declaration -->
<div th:fragment="bookCards(books)">

    <!--    Display alert if there's no books data  -->
    <div th:if="${books == null or #lists.isEmpty(books)}"
         class="alert alert-info">No result found
    </div>

    <div class="d-flex flex-row flex-wrap gap-4 justify-content-center">

        <!--        Iterate through results     -->
        <div th:if="${books != null and !#lists.isEmpty(books)}"
             th:each="bookEntity : ${books}"
             class="card"
             style="width:18rem;">

            <!--            Display bookEntity covers-->
            <div style="height: 21rem; overflow: hidden">
                <img th:src="${bookEntity?.volumeInfo?.imageLinks?.smallThumbnail ?: 'static/images/bookCoverNotFound.png'}"
                     th:alt="${bookEntity?.volumeInfo?.title ?: 'Book cover'}"
                     class="card-imt-top img-fluid w-100 h-100"
                     style="object-fit: cover">
            </div>

            <!--            Display bookEntity data such as author, title and button leading to bookEntity details-->
            <div class="card-body d-flex flex-column">
                <h4 class=card-title
                    th:text="${bookEntity?.volumeInfo?.title ?: 'Unknown title'}">
                </h4>

                <p class="card-text text-muted"
                   th:if="${bookEntity?.volumeInfo?.authors != null and !#lists.isEmpty(bookEntity.volumeInfo?.authors)}"
                   th:text="${#strings.listJoin(bookEntity?.volumeInfo?.authors, ', ')}">
                </p>

                <p class="cards-text text-muted"
                   th:unless="${bookEntity.volumeInfo?.authors == null and #lists.isEmpty(bookEntity.volumeInfo.authors)}">
                </p>

                <!--                Send user to bookDetails page that display detailed information about given bookEntity       -->
                <form th:action="@{/books/details/{id}(id=${bookEntity?.id})}" method="get">
                    <button class="btn btn-primary mt-auto" type="submit">Details
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
