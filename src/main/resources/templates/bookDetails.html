<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--    Tag for making fragment responsive. Control page dimensions of different devices    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search results</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}">

</head>
<body>

<div th:replace="~{fragments/topNavbar :: top-navbar}"></div>

<div th:object="${bookDetails}">

    <div th:if="${bookDetails} == null" class="alert alert-info">
        No results found.
    </div>

    <div th:if="${bookDetails} != null">
        <div class="container mt-5">
            <div class="row">

                <div class="col-12 col-md-5 col-lg-4">
                    <img class="img-fluid"
                         th:src="*{volumeInfo?.imageLinks?.smallThumbnail}"
                         src="/images/bookCoverNotFound.png"
                         alt="Book cover">
                </div>

                <!--        RIGHT SIDE-->
                <div class="col-12 col-md-7 col-lg-8">

                    <p class="text-muted"
                       th:text="'Categories: ' + (*{#strings.listJoin(volumeInfo?.categories, ', ')} ?: 'Unknown categories')"></p>

                    <h1 class="book-title" th:text="*{volumeInfo.title} ?: 'Unknown title'"></h1>
                    <h4 th:text="'Published by: ' + (*{volumeInfo?.publisher} ?: 'Unknown publisher')"></h4>
                    <h4 th:text="'Publish date: ' + (*{volumeInfo?.publishedDate} ?: 'Unknown publish date')"></h4>
                    <h4 th:text="'Number of pages: ' + (*{volumeInfo?.pageCount} ?: 'Unknown number of pages')"></h4>

                    <!--            TODO TEMPORARY-->
                    <div class="stars">★★★☆☆</div>

                    <p class="book-description mt-3"
                       th:text="*{volumeInfo?.description} ?: 'Description not available'"></p>

                    <div class="d-flex gap-2">
                        <button class="btn add-btn">Add to favorites</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
