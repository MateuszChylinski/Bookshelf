<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>

    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@coreui/coreui-pro@5.24.2/dist/css/coreui.min.css" rel="stylesheet">
    <link th:href="@{/css/bookDetails.css}" rel="stylesheet">

    <title>Search results</title>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@coreui/coreui-pro@5.24.2/dist/js/coreui.bundle.min.js"></script>

    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link th:href="@{/css/rating.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/topNavbar :: top-navbar}"></div>
<div th:object="${bookDetails}">

    <div th:if="${bookDetails} == null" class="alert alert-info">
        No results found.
    </div>

    <div class="book-card"
         id="book-information"
         th:data-api-id="*{id}"
         th:data-title="*{volumeInfo?.title}"
         th:data-authors="*{#strings.listJoin(volumeInfo?.authors, ', ')}"
         th:data-pages="*{volumeInfo?.pageCount}"
         th:data-description="*{volumeInfo?.description}"
         th:data-genres="*{#strings.listJoin(volumeInfo?.categories, ', ')}"
         th:data-thumbnail-url="*{volumeInfo?.imageLinks?.thumbnail}">

        <div class="container">
            <div sec:authorize="isAuthenticated()">

                <a id="shelfButton" class="btn btn-large btn-success"
                   th:text="${shelfBookData} ? 'Remove' : 'Add'"
                   th:data-is-on-the-shelf="${shelfBookData != null}"
                   th:data-book-api-id="${bookDetails?.id}"></a>

                <i
                        th:class="${shelfBookData?.isFavorite} ? 'bi-eye-fill' : 'bi-eye' "
                        th:data-is-favorite="${shelfBookData?.isFavorite}"
                        id="favIcon"
                        style="font-size: 60px; cursor: pointer">
                </i>

                <div class="dropdown show">
                    <a class="btn btn-secondary dropdown-toggle"
                       th:text="${shelfBookData?.bookStatus} ?: 'Book Status' "
                       href="#"
                       id="bookStateEnum" data-bs-toggle="dropdown"
                       aria-haspopup="true" aria-expanded="false">
                    </a>

                    <div class="dropdown-menu" aria-labelledby="bookStateEnum">
                        <a class="dropdown-item" href="#"
                           id="bookStatusEnum"
                           th:each="status: ${bookStatus}"
                           th:text="${status?.name}"
                           th:data-status="${status}"></a>
                    </div>
                    <div id="bookRate" th:data-coreui-value="${shelfBookData?.bookRating}" class="bookRate"
                         data-coreui-toggle="rating"></div>

                    <form id="bookNotesForm" action="#"
                          th:classappend="${shelfBookData == null} ? 'd-none'"
                          th:action="@{/books/details/{id}/note(id=${bookDetails?.id})}" method="POST">
                        <div class="input-group mb-3">
                            <span class="input-group-text"
                                  id="inputGroup-sizing-default">Share your <br> thoughts: </span>
                            <input name="note" type="text" class="form-control" aria-label="Sizing example input"
                                   aria-describedby="inputGroup-sizing-default"/>
                            <button class="btn btn-outline-secondary" type="submit" id="saveBookNote">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${bookDetails} != null">
        <div class="container mt-5">
            <div class="row">

                <div class="col-12 col-md-5 col-lg-4">
                    <img class="img-fluid"
                         th:src="*{volumeInfo?.imageLinks?.smallThumbnail}"
                         src="/images/bookCoverNotFound.png"
                         alt="Book cover">
                </div>

                <!--        RIGHT SIDE-->
                <div class="col-12 col-md-7 col-lg-8">

                    <p class="text-muted"
                       th:text="'Categories: ' + (*{#strings.listJoin(volumeInfo?.categories, ', ')} ?: 'Unknown categories')"></p>
                    <h1 class="bookEntity-title" th:text="*{volumeInfo?.title} ?: 'Unknown title'"></h1>
                    <h4 th:text="'Published by: ' + (*{volumeInfo?.publisher} ?: 'Unknown publisher')"></h4>
                    <h4 th:text="'Publish date: ' + (*{volumeInfo?.publishedDate} ?: 'Unknown publish date')"></h4>
                    <h4 th:text="'Number of pages: ' + (*{volumeInfo?.pageCount} ?: 'Unknown number of pages')"></h4>

                    <p class="bookEntity-description mt-3"
                       th:text="*{volumeInfo?.description} ?: 'Description not available'"></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" th:src="@{/js/actions.js}"></script>
<script type="text/javascript" th:src="@{/js/helpers.js}"></script>
<script type="text/javascript" th:src="@{/js/triggers.js}"></script>
<script type="text/javascript" th:src="@{/js/states.js}"></script>
</body>
</html>
