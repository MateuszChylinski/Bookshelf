<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--    Tag for making fragment responsive. Control page dimensions of different devices    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search results</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!--    Fragment definition done for reusability    -->
<div th:fragment="searchResults(results)"
     class="d-flex flex-row flex-wrap gap-4 justify-content-center">

    <!--    Display alert when no results were found    -->
    <div th:if="${results == null or #lists.isEmpty(results)}"
         class="alert alert-info">No results found
    </div>

    <!--    Iterate through results    -->
    <div th:if="${results != null and !#lists.isEmpty(results)}"
         th:each="results : ${results}"
         class="card"
         style="width: 18rem;">

        <!--    Display book covers    -->
        <div style="height: 21rem; overflow: hidden">
            <img th:src="${results.volumeInfo?.imageLinks?.smallThumbnail ?: 'static/images/bookCoverNotFound.png'}"
                 th:alt="${results.volumeInfo?.title ?: 'Book cover'}"
                 class="card-img-top img-fluid w-100 h-100"
                 style="object-fit: cover"/>
        </div>

        <!--Display book title and authors-->
        <div class="card-body d-flex flex-column">
            <h5 class="card-title"
                th:text="${results?.volumeInfo?.title ?: 'Unknown title'}">
            </h5>

            <p class="card-text text-muted"
               th:if="${results?.volumeInfo?.authors != null and !#lists.isEmpty(results.volumeInfo.authors)}"
               th:text="${#strings.listJoin(results.volumeInfo.authors, ', ')}">
            </p>

            <p class="card-text text-muted"
               th:unless="${results.volumeInfo?.authors != null and !#lists.isEmpty(results.volumeInfo.authors)}">
                Unknown author
            </p>

            <!--Button leading for detailed info about book TODO-->
            <a href="#" class="btn btn-primary mt-auto">Details</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
