spring.config.import=classpath:env.properties
spring.application.name=bookshelf

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/bookshelf
spring.datasource.username=${database_username}
spring.datasource.password=${database_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql = true

# Prevent using URL parameters for session tracking
server.servlet.session.tracking-modes=cookie
# Browser script won't be able to access the cookie
server.servlet.session.cookie.http-only=true
# Send cookie only over https connection
server.servlet.session.cookie.secure=true
